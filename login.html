<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <script>try{if(localStorage.getItem('finanz_dark')==="1")document.documentElement.classList.add("dark");}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinanzApp – Ingresar</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-logo" id="login-logo-icon"></div>
      <h1 class="login-title">FinanzApp</h1>
      <p class="login-sub">Controla tus finanzas personales desde cualquier dispositivo</p>
      <button class="btn-google" onclick="loginWithGoogle()">
        <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google">
        Continuar con Google
      </button>
      <p class="login-error" id="login-error"></p>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById('login-logo-icon').innerHTML = SVG.dollar;
    auth.onAuthStateChanged(user => {
      if (user) window.location.href = 'index.html';
    });
  </script>
</body>
</html>
